[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
thiserror = "2"
proptest = "1"
tokio = { version = "1", default-features = false }
tracing = "0.1"
tempfile = "3"
ha2lux-core = { path = "crates/ha2lux-core" }

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
