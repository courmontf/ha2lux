# Politique cargo-deny (format cargo-deny >= 0.18).
[advisories]
yanked = "deny"
# "Unmaintained" advisories (not vulnerabilities): the zvariant/zbus_names family was merged
# into `zbus`; these crates no longer receive updates and no replacement version is
# published for zbus 5. Re-evaluate at the next zbus and ksni version bump.
ignore = ["RUSTSEC-2026-0370", "RUSTSEC-2026-0371", "RUSTSEC-2026-0372"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # Mozilla root certificates (webpki-root-certs, pulled in by rustls-platform-verifier).
    "CDLA-Permissive-2.0",
    # ksni (notification-area icon): public domain.
    "Unlicense",
]
confidence-threshold = 0.8
# The workspace crates are MIT-licensed (publish = false: never published on crates.io).
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
