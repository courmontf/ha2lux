[package]
name = "ha2lux-backends"
description = "Backends matériels de ha2lux : DDC/CI, backlight, backend factice."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ha2lux-core.workspace = true
ha2lux-i18n = { path = "../ha2lux-i18n" }
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "fs", "macros"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
i2cdev = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "test-util"] }

[lints]
workspace = true
