[package]
name = "ha2lux-secrets"
description = "Stockage du jeton Home Assistant : trousseau du bureau (Secret Service) avec repli fichier 0600."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ha2lux-core.workspace = true
ha2lux-i18n = { path = "../ha2lux-i18n" }
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["time", "sync"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }

[lints]
workspace = true
