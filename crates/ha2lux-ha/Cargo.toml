[package]
name = "ha2lux-ha"
description = "Client Home Assistant de ha2lux (REST et WebSocket)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false }
futures-util = "0.3.34"
ha2lux-core.workspace = true
ha2lux-i18n = { path = "../ha2lux-i18n" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "system-proxy"] }
rustls = "0.23.46"
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "net", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
proptest.workspace = true
rcgen = "0.14.7"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "test-util"] }
tokio-rustls = "0.26.6"
